{% extends "base.html" %}
{% block title %}Games - {{ site_title }}{% endblock %}

{% block content %}
<div class="message-box">
  <h2>Games</h2>

  <ul class="game-list">
    <li><a href="{{ url_for('bowl') }}">&#127944; Victard Bowl</a>
      <span class="nb">&middot; <a href="{{ url_for('bowl_leaderboard') }}">Leaderboard</a></span></li>

    <li><a href="{{ url_for('stadium_game') }}">&#127943; Stadium Guesser</a>
      {%- if stadium_ready %}
      <span class="nb">&middot; <a href="{{ url_for('stadium_leaderboard') }}">Leaderboard</a></span>
      {%- else %}
      <span class="hint">&mdash; not loaded yet</span>
      {%- endif %}</li>
  </ul>
</div>
{% endblock %}
