{% extends "base.html" %}
{% block title %}Chat - {{ site_title }}{% endblock %}

{% block content %}
<div class="chat-wrap" id="chat-wrap">
  <p class="byline"><b>Chat</b> <span id="chat-online" role="button" tabindex="0"></span>
    {%- if voice %}<span id="voice" data-ice="stun:stun.cloudflare.com:3478"{% if user['is_admin'] %} data-admin="1"{% endif %}></span>{% endif %}
    {%- if user and user['is_admin'] %} &middot;
    <a href="#" id="chat-clear" class="hint">clear the room</a>{% endif %}</p>
  <div class="chat-flex" id="chat-flex">
    <div class="chat-main">
      <div id="chat-messages"></div>
      <button type="button" id="chat-new" hidden>&#8595; new messages</button>
    </div>
    <div id="chat-roster"><b>In the room</b><div id="chat-roster-names"></div></div>
  </div>
  <form id="chat-form" autocomplete="off">
    <input type="text" id="chat-text" maxlength="500" autofocus enterkeyhint="send">
    <button type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  var wrap = document.getElementById("chat-wrap");
  var flex = document.getElementById("chat-flex");
  var box = document.getElementById("chat-messages");
  var newBtn = document.getElementById("chat-new");
  var form = document.getElementById("chat-form");
  var input = document.getElementById("chat-text");
  var onlineEl = document.getElementById("chat-online");
  var lastId = 0;
  var epoch = null;
  var URL_RE = /(https?:\/\/[^\s<>"]+)/g;
  var myHandle = {{ user['handle'] | tojson }};
  var baseTitle = document.title;
  var unseen = 0;
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { unseen = 0; document.title = baseTitle; }
  });

  function nearBottom() {
    return box.scrollTop + box.clientHeight >= box.scrollHeight - 80;
  }
  function toBottom() {
    box.scrollTop = box.scrollHeight;
    newBtn.hidden = true;
  }

  // The room fills the screen: the message box takes whatever the viewport
  // has left after the byline and the input, and the page opens scrolled to
  // it (the header is one swipe up). On a phone, visualViewport shrinks when
  // the keyboard comes up, so the box shrinks with it and the input stays
  // in view. Measurements go through getBoundingClientRect because the
  // Large/Huge text sizes zoom the body.
  var vv = window.visualViewport;
  function fit() {
    var stick = nearBottom();
    var vh = vv ? vv.height : window.innerHeight;
    var rect = flex.getBoundingClientRect();
    var zoom = flex.offsetHeight ? rect.height / flex.offsetHeight : 1;
    var chrome = wrap.getBoundingClientRect().height - rect.height;
    var h = Math.max(140, Math.floor(vh - chrome - 24));
    flex.style.height = Math.round(h / zoom) + "px";
    if (stick) toBottom();
  }
  function alignTop() {
    window.scrollTo(0, wrap.getBoundingClientRect().top + window.pageYOffset - 6);
  }

  // who's in the room: a column beside the messages on a wide screen, folded
  // into the count on a phone; tapping the count toggles it either way
  wrap.classList.toggle("roster", window.matchMedia("(min-width: 701px)").matches);
  function toggleRoster(e) {
    if (e.type === "keydown" && e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    wrap.classList.toggle("roster");
    fit();
  }
  onlineEl.addEventListener("click", toggleRoster);
  onlineEl.addEventListener("keydown", toggleRoster);

  function renderText(target, text) {
    var parts = text.split(URL_RE);
    for (var i = 0; i < parts.length; i++) {
      if (/^https?:\/\//.test(parts[i])) {
        var a = document.createElement("a");
        a.href = parts[i];
        a.textContent = parts[i];
        a.rel = "nofollow";
        a.target = "_blank";
        target.appendChild(a);
      } else if (parts[i]) {
        target.appendChild(document.createTextNode(parts[i]));
      }
    }
  }

  function addMessage(m) {
    var div = document.createElement("div");
    if (m.sys) {
      div.className = "chat-msg chat-sys";
      div.textContent = m.text;
      box.appendChild(div);
      return;
    }
    if (m.poll) { addPoll(m); return; }
    div.className = "chat-msg";
    if (m.handle !== myHandle &&
        m.text.toLowerCase().indexOf(myHandle.toLowerCase()) !== -1) {
      div.className += " chat-mention";
    }
    var handle = document.createElement("b");
    handle.className = "chat-handle";
    handle.setAttribute("data-handle", m.handle);
    handle.textContent = m.handle + ": ";
    var text = document.createElement("span");
    renderText(text, m.text);
    var time = document.createElement("span");
    time.className = "chat-time";
    time.textContent = " " + m.time;
    div.appendChild(handle);
    div.appendChild(text);
    div.appendChild(time);
    box.appendChild(div);
    while (box.children.length > 250) box.removeChild(box.firstChild);
  }

  // a live poll: "/poll question? option, option". The question and the
  // options draw once; the names under each option redraw from every poll
  // of the server, since votes change a message that's already on screen.
  var polls = {};   // message id -> {rows: [{names, count}], options}
  function addPoll(m) {
    var div = document.createElement("div");
    div.className = "chat-msg chat-poll";
    var head = document.createElement("div");
    var handle = document.createElement("b");
    handle.className = "chat-handle";
    handle.setAttribute("data-handle", m.handle);
    handle.textContent = m.handle + " asks: ";
    var q = document.createElement("span");
    q.className = "chat-poll-q";
    q.textContent = m.poll.q;
    var time = document.createElement("span");
    time.className = "chat-time";
    time.textContent = " " + m.time;
    head.appendChild(handle); head.appendChild(q); head.appendChild(time);
    div.appendChild(head);
    var rows = [];
    m.poll.options.forEach(function (opt, i) {
      var row = document.createElement("div");
      row.className = "chat-poll-row";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chat-poll-opt";
      btn.textContent = opt;
      btn.addEventListener("click", function () {
        var body = new FormData();
        body.append("id", m.id); body.append("option", i);
        fetch("/chat/vote", { method: "POST", body: body }).then(poll);
      });
      var count = document.createElement("b");
      count.className = "chat-poll-count";
      var names = document.createElement("span");
      names.className = "chat-poll-names";
      row.appendChild(btn); row.appendChild(count); row.appendChild(names);
      div.appendChild(row);
      rows.push({ btn: btn, count: count, names: names });
    });
    box.appendChild(div);
    polls[m.id] = rows;
  }
  function drawVotes(all) {
    Object.keys(all).forEach(function (id) {
      var rows = polls[id];
      if (!rows) return;
      var by = rows.map(function () { return []; });
      all[id].forEach(function (v) { if (by[v[1]]) by[v[1]].push(v[0]); });
      rows.forEach(function (r, i) {
        r.count.textContent = by[i].length ? " " + by[i].length : "";
        r.names.textContent = by[i].length ? " — " + by[i].join(", ") : "";
        r.btn.classList.toggle("chosen", by[i].indexOf(myHandle) !== -1);
      });
    });
  }

  // tap a name — on a message or in the room — to answer them: "@Name " goes
  // in front of whatever you've typed
  function tapName(e) {
    var h = e.target.closest(".chat-handle");
    if (!h) return;
    var at = "@" + h.getAttribute("data-handle") + " ";
    if (input.value.indexOf(at) === -1) input.value = at + input.value;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
  box.addEventListener("click", tapName);
  document.getElementById("chat-roster").addEventListener("click", tapName);

  var polling = false;
  function poll() {
    if (polling) return;   // overlapping polls double-drew messages
    polling = true;
    fetch("/chat/messages?since=" + lastId)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (epoch !== null && d.epoch !== epoch) { box.textContent = ""; }
        epoch = d.epoch;
        var stick = nearBottom();
        var drew = 0, others = 0;
        (d.messages || []).forEach(function (m) {
          if (m.id <= lastId) return;   // already drawn (belt to the flag's suspenders)
          addMessage(m);
          lastId = m.id;
          drew++;
          if (!m.sys && m.handle !== myHandle) others++;
          if (document.hidden && !m.sys && m.handle !== myHandle) {
            unseen++;
            document.title = "(" + unseen + ") " + baseTitle;
          }
        });
        drawVotes(d.polls || {});
        if (window.chatVoice) window.chatVoice(d.voice);
        if (drew && stick) {
          toBottom();
        } else if (others && !stick) {
          newBtn.hidden = false;   // you're reading back; don't yank the scroll
        }
        onlineEl.textContent = "🟢 " + d.online + " in the room";
        var rn = document.getElementById("chat-roster-names");
        rn.textContent = "";
        (d.names || []).forEach(function (n) {
          var div = document.createElement("div");
          div.className = "chat-handle";
          div.setAttribute("data-handle", n);
          div.textContent = n;
          rn.appendChild(div);
        });
      })
      .catch(function () {})
      .then(function () { polling = false; });
  }

  newBtn.addEventListener("click", function () { toBottom(); input.focus(); });
  box.addEventListener("scroll", function () { if (nearBottom()) newBtn.hidden = true; });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    var body = new FormData();
    body.append("text", text);
    fetch("/chat/send", { method: "POST", body: body })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) { input.value = ""; toBottom(); }
        poll();
      });
  });

  var clearLink = document.getElementById("chat-clear");
  if (clearLink) {
    clearLink.addEventListener("click", function (e) {
      e.preventDefault();
      if (!confirm("Clear the chat room for everyone?")) return;
      fetch("/chat/clear", { method: "POST" }).then(poll);
    });
  }

  fit();
  alignTop();
  (vv || window).addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
  poll();
  setInterval(poll, 2000);
})();
</script>
{% if voice %}<script src="{{ url_for('static', filename='chatvoice.js') }}"></script>{% endif %}
{% endblock %}
