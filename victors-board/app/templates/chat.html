{% extends "base.html" %}
{% block title %}Chat - {{ site_title }}{% endblock %}

{% block content %}
<div class="chat-wrap">
  <p class="byline"><b>Chat</b> &mdash; nothing here is saved. Messages scroll
    off and die; a restart empties the room. <span id="chat-online"></span>
    {%- if user and user['is_admin'] %} &middot;
    <a href="#" id="chat-clear" class="hint">clear the room</a>{% endif %}</p>
  <div class="chat-flex">
    <div id="chat-messages"></div>
    <div id="chat-roster"><b>In the room</b><div id="chat-roster-names"></div></div>
  </div>
  <form id="chat-form" autocomplete="off">
    <input type="text" id="chat-text" maxlength="500"
           placeholder="say it &mdash; it disappears" autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  var box = document.getElementById("chat-messages");
  var form = document.getElementById("chat-form");
  var input = document.getElementById("chat-text");
  var onlineEl = document.getElementById("chat-online");
  var lastId = 0;
  var epoch = null;
  var URL_RE = /(https?:\/\/[^\s<>"]+)/g;
  var myHandle = {{ user['handle'] | tojson }};
  var baseTitle = document.title;
  var unseen = 0;
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { unseen = 0; document.title = baseTitle; }
  });

  function nearBottom() {
    return box.scrollTop + box.clientHeight >= box.scrollHeight - 80;
  }

  function renderText(target, text) {
    var parts = text.split(URL_RE);
    for (var i = 0; i < parts.length; i++) {
      if (/^https?:\/\//.test(parts[i])) {
        var a = document.createElement("a");
        a.href = parts[i];
        a.textContent = parts[i];
        a.rel = "nofollow";
        a.target = "_blank";
        target.appendChild(a);
      } else if (parts[i]) {
        target.appendChild(document.createTextNode(parts[i]));
      }
    }
  }

  function addMessage(m) {
    var div = document.createElement("div");
    if (m.sys) {
      div.className = "chat-msg chat-sys";
      div.textContent = m.text;
      box.appendChild(div);
      return;
    }
    div.className = "chat-msg";
    if (m.handle !== myHandle &&
        m.text.toLowerCase().indexOf(myHandle.toLowerCase()) !== -1) {
      div.className += " chat-mention";
    }
    var handle = document.createElement("b");
    handle.textContent = m.handle + ": ";
    var text = document.createElement("span");
    renderText(text, m.text);
    var time = document.createElement("span");
    time.className = "chat-time";
    time.textContent = " " + m.time;
    div.appendChild(handle);
    div.appendChild(text);
    div.appendChild(time);
    box.appendChild(div);
    while (box.children.length > 250) box.removeChild(box.firstChild);
  }

  var polling = false;
  function poll() {
    if (polling) return;   // overlapping polls double-drew messages
    polling = true;
    fetch("/chat/messages?since=" + lastId)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (epoch !== null && d.epoch !== epoch) { box.textContent = ""; }
        epoch = d.epoch;
        var stick = nearBottom();
        var drew = 0;
        (d.messages || []).forEach(function (m) {
          if (m.id <= lastId) return;   // already drawn (belt to the flag's suspenders)
          addMessage(m);
          lastId = m.id;
          drew++;
          if (document.hidden && !m.sys && m.handle !== myHandle) {
            unseen++;
            document.title = "(" + unseen + ") " + baseTitle;
          }
        });
        if (drew && stick) {
          box.scrollTop = box.scrollHeight;
        }
        onlineEl.textContent = "🟢 " + d.online + " in the room";
        var rn = document.getElementById("chat-roster-names");
        rn.textContent = "";
        (d.names || []).forEach(function (n) {
          var div = document.createElement("div");
          div.textContent = n;
          rn.appendChild(div);
        });
      })
      .catch(function () {})
      .then(function () { polling = false; });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    var body = new FormData();
    body.append("text", text);
    fetch("/chat/send", { method: "POST", body: body })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) { input.value = ""; }
        poll();
      });
  });

  var clearLink = document.getElementById("chat-clear");
  if (clearLink) {
    clearLink.addEventListener("click", function (e) {
      e.preventDefault();
      if (!confirm("Clear the chat room for everyone?")) return;
      fetch("/chat/clear", { method: "POST" }).then(poll);
    });
  }

  poll();
  setInterval(poll, 2000);
  box.scrollTop = box.scrollHeight;
})();
</script>
{% endblock %}
