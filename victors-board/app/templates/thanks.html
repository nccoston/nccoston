<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thank you</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #00274C; overflow: hidden; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
.m { position: relative; z-index: 2; width: min(56vw, 46vh, 420px); height: auto; filter: drop-shadow(0 18px 40px rgba(0,0,0,.45)); animation: breathe 3.2s ease-in-out infinite; }
.m.hit { animation: bounce .55s cubic-bezier(.2,1.4,.4,1) 1; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
@keyframes bounce { 0% { transform: scale(1); } 30% { transform: scale(1.16) rotate(-2deg); } 60% { transform: scale(.96) rotate(1deg); } 100% { transform: scale(1); } }
.flag { position: relative; z-index: 2; width: min(34vw, 170px); margin-top: 5vh; opacity: 0; transition: opacity .8s; mix-blend-mode: screen; }   /* screen: the GIF's black box vanishes into the navy */
.flag.on { opacity: 1; }
.seal { position: fixed; inset: 0; z-index: 1; background: url("{{ url_for('static', filename='U-M-seal.svg') }}") center / min(140vw, 1100px) no-repeat; opacity: .05; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="seal"></div>
<img class="m" id="m" src="{{ url_for('static', filename='blockm.png') }}" alt="">
<img class="flag" id="flag" src="{{ url_for('static', filename='goblu.gif') }}" alt="">
{% if has_song %}<audio id="song" preload="none" src="{{ url_for('static', filename='victors.mp3') }}"></audio>{% endif %}
<script>
(function () {
  // confetti: maize, blue and white, falling the whole time, denser on a tap
  var cv = document.getElementById("c"), cx = cv.getContext("2d");
  var W, H, bits = [], COLORS = ["#FFCB05", "#FFCB05", "#FFCB05", "#ffffff", "#7fb2e5", "#FFCB05"];
  function size() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", size); size();
  function bit(burst) {
    var s = (6 + Math.random() * 8) * devicePixelRatio;
    return { x: Math.random() * W, y: burst ? H * 0.5 + (Math.random() - .5) * H * 0.3 : -s * 2,
             w: s, h: s * (0.4 + Math.random() * 0.6), c: COLORS[Math.random() * COLORS.length | 0],
             vx: (Math.random() - .5) * (burst ? 14 : 1.2) * devicePixelRatio,
             vy: burst ? (Math.random() - .9) * 16 * devicePixelRatio : (1.2 + Math.random() * 2.2) * devicePixelRatio,
             a: Math.random() * Math.PI * 2, va: (Math.random() - .5) * 0.22, t: 0 };
  }
  for (var i = 0; i < 90; i++) { var b = bit(false); b.y = Math.random() * H; bits.push(b); }
  function frame() {
    cx.clearRect(0, 0, W, H);
    for (var i = bits.length - 1; i >= 0; i--) {
      var b = bits[i];
      b.vy += 0.045 * devicePixelRatio; b.vx *= 0.995;
      b.x += b.vx + Math.sin(b.t * 0.05 + b.a) * 0.6 * devicePixelRatio; b.y += b.vy; b.a += b.va; b.t++;
      if (b.y > H + 20) { bits[i] = bit(false); continue; }
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.a);
      cx.fillStyle = b.c; cx.globalAlpha = 0.92;
      cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.t * 0.08 + b.a)) + 1);
      cx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();

  // a tap: the M jumps, the flag comes out, the confetti bursts, the band plays
  var m = document.getElementById("m"), flag = document.getElementById("flag"), song = document.getElementById("song");
  function hit() {
    m.classList.remove("hit"); void m.offsetWidth; m.classList.add("hit");
    flag.classList.add("on");
    for (var i = 0; i < 140; i++) bits.push(bit(true));
    if (bits.length > 600) bits.splice(0, bits.length - 600);
    if (song) {
      if (song.paused) { var p = song.play(); if (p && p.catch) p.catch(function () {}); }
      else { song.pause(); }
    }
  }
  document.body.addEventListener("click", hit);
  setTimeout(function () { flag.classList.add("on"); }, 1200);
})();
</script>
</body>
</html>
