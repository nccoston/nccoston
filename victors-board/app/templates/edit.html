{% extends "base.html" %}
{% block title %}Edit - {{ site_title }}{% endblock %}

{% block content %}
<div class="message-box">
  <h2>Edit Message</h2>
  <p class="byline">Posted by <b>{{ msg['author_name'] }}</b>
    <i>{{ msg['created_at'] | boardtime }}</i></p>

  <form class="board-form" method="post" enctype="multipart/form-data">
    <label>Subject
      <input type="text" name="subject" maxlength="300" required
             value="{{ request.form.get('subject', msg['subject']) }}">
    </label>
    <label>Message
      <textarea name="body">{{ request.form.get('body', msg['body'] or '') }}</textarea>
    </label>
    <label>Image URL
      <input type="text" name="image_url"
             value="{{ request.form.get('image_url', msg['image_url'] or '') }}">
    </label>
    <label>Or upload pictures <span class="hint">(the first replaces the
      attached picture; any others are added to the message)</span>
      <input type="file" name="image_file" multiple accept="image/*">
    </label>
    <label>Picture display size</label>
    <p class="size-row">
      {% for s in ('small', 'medium', 'large', 'full') %}
      <label class="size-opt"><input type="radio" name="image_size" value="{{ s }}"
        {% if request.form.get('image_size', msg['image_size'] or 'full') == s %}checked{% endif %}> {{ s }}</label>
      {% endfor %}
    </p>
    <button type="submit">Save Changes</button>
    <a href="{{ url_for('message', message_id=msg['id']) }}">Cancel</a>
  </form>
</div>
{% endblock %}
