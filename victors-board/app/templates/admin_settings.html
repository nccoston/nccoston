{% extends "base.html" %}
{% block title %}Admin settings - {{ site_title }}{% endblock %}

{% block content %}
<div class="message-box">
  <h2>Admin</h2>
  {% include "_admin_nav.html" %}

  <h3>Board settings</h3>
  <form class="board-form" method="post">
    <input type="hidden" name="action" value="settings">
    <label>Board title
      <input type="text" name="site_title" value="{{ site_title }}">
    </label>
    <label>Header HTML <span class="hint">(rules, admin list — raw HTML)</span>
      <textarea name="header_html">{{ header_html }}</textarea>
    </label>
    <label>Links row HTML
      <textarea name="links_html" style="height:60px">{{ links_html }}</textarea>
    </label>
    <label>
      <input type="checkbox" name="registration_open" {% if registration_open %}checked{% endif %}>
      Registration open
    </label>
    <label>Hall of Fame votes needed to enshrine
      <input type="text" name="hof_threshold" value="{{ hof_threshold }}" style="width:60px">
    </label>
    <label>Pod YouTube channel ID <span class="hint">(the UC&hellip; id; blank
      turns the pod box off)</span>
      <input type="text" name="podcast_channel_id" value="{{ podcast_channel_id }}">
    </label>
    <label>Pod show title filter <span class="hint">(the channel carries several
      shows; only titles containing this count. Blank = whole channel)</span>
      <input type="text" name="podcast_title_filter" value="{{ podcast_title_filter }}">
    </label>
    <button type="submit">Save settings</button>
  </form>
</div>
{% endblock %}
