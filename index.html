<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Andy</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #333;
    }

    #fart-btn {
      font-size: 5rem;
      padding: 1rem 2rem;
      border: none;
      border-radius: 1rem;
      background: #4CAF50;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px #2e7d32;
      transition: transform 0.1s, box-shadow 0.1s;
      user-select: none;
    }

    #fart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px #2e7d32;
    }

    #message {
      margin-top: 2rem;
      font-size: 1.5rem;
      color: #555;
      min-height: 2rem;
    }
  </style>
</head>
<body>
  <h1>Hey Andy 👋</h1>
  <button id="fart-btn">💨</button>
  <div id="message"></div>

  <script>
    const messages = [
      "Classic.",
      "Disgusting.",
      "Blaming it on the dog.",
      "Whoever smelt it...",
      "The silent ones are worse.",
      "Was that necessary?",
      "10/10.",
      "You monster.",
      "Art.",
    ];

    document.getElementById("fart-btn").addEventListener("click", () => {
      fart();
      const msg = messages[Math.floor(Math.random() * messages.length)];
      document.getElementById("message").textContent = msg;
    });

    function fart() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const duration = 0.6 + Math.random() * 0.6;
      const startFreq = 80 + Math.random() * 100;
      const endFreq = 30 + Math.random() * 40;

      const osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(startFreq, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + duration);

      const bufferSize = ctx.sampleRate * duration;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const gainNode = ctx.createGain();
      gainNode.gain.setValueAtTime(0.4, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.15, ctx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

      osc.connect(gainNode);
      noise.connect(noiseGain);
      gainNode.connect(ctx.destination);
      noiseGain.connect(ctx.destination);

      osc.start();
      noise.start();
      osc.stop(ctx.currentTime + duration);
      noise.stop(ctx.currentTime + duration);
    }
  </script>
</body>
</html>
